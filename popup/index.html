<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICPC Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <!-- HOME -->
    <section id="view-home" class="view">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">IC</div>
        <div><h1>ICPC Tracker</h1><p>Codeforces progress tracker</p></div>
      </header>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item" type="button" data-nav="groups">
          <span class="nav-icon" aria-hidden="true">🗂️</span>
          <span class="nav-text"><strong>Groups</strong><small id="nav-groups-count">0 groups</small></span>
          <span class="nav-arrow" aria-hidden="true">›</span>
        </button>
        <button class="nav-item" type="button" data-nav="students">
          <span class="nav-icon" aria-hidden="true">👤</span>
          <span class="nav-text"><strong>Students</strong><small id="nav-students-count">0 students</small></span>
          <span class="nav-arrow" aria-hidden="true">›</span>
        </button>
        <button class="nav-item" type="button" data-nav="sheets">
          <span class="nav-icon" aria-hidden="true">📄</span>
          <span class="nav-text"><strong>Sheets</strong><small id="nav-sheets-count">0 sheets</small></span>
          <span class="nav-arrow" aria-hidden="true">›</span>
        </button>
        <button class="nav-item" type="button" id="open-backup">
          <span class="nav-icon" aria-hidden="true">💾</span>
          <span class="nav-text"><strong>Backup &amp; restore</strong><small>Save or reload groups, sheets, students</small></span>
          <span class="nav-arrow" aria-hidden="true">↗</span>
        </button>
        <button class="nav-item nav-primary" type="button" id="open-dashboard">
          <span class="nav-icon" aria-hidden="true">📊</span>
          <span class="nav-text"><strong>Dashboard</strong><small>Opens in a new tab</small></span>
          <span class="nav-arrow" aria-hidden="true">↗</span>
        </button>
      </nav>
      <p class="form-message" id="home-message" role="status" aria-live="polite"></p>
      <section class="page-card" aria-live="polite">
        <div class="section-heading"><span class="status-dot" id="status-dot"></span><h2>Current page</h2></div>
        <p class="page-status" id="page-status">Checking the active tab…</p>
        <dl class="page-details" id="page-details" hidden>
          <div><dt>Sheet (contest)</dt><dd id="contest-id">—</dd></div>
          <div><dt>Group</dt><dd id="group-code">—</dd></div>
          <div><dt>Problems</dt><dd id="problem-count">—</dd></div>
          <div><dt>Participants</dt><dd id="participant-count">—</dd></div>
        </dl>
      </section>
    </section>


    <!-- GROUPS -->
    <section id="view-groups" class="view" hidden>
      <header class="view-header">
        <button class="back-button" type="button" data-nav="home" aria-label="Back">‹ Back</button>
        <h2>Groups</h2><span class="count-pill" id="group-count">0 groups</span>
      </header>
      <form id="group-form" class="card-form" novalidate>
        <div class="field"><label for="group-url">Codeforces group link</label><input id="group-url" type="url" inputmode="url" placeholder="https://codeforces.com/group/XXXX" autocomplete="off" spellcheck="false" required></div>
        <div class="field"><label for="group-name">Group name (optional)</label><input id="group-name" type="text" maxlength="80" placeholder="e.g. Group 1 — Beginners" autocomplete="off"></div>
        <div class="form-actions">
          <button class="btn primary" id="find-sheets" type="submit">Find sheets</button>
          <button class="btn primary" id="save-group-edit" type="submit" hidden>Save name</button>
          <button class="btn" id="cancel-group-edit" type="button" hidden>Cancel</button>
        </div>
        <p class="form-message" id="group-form-message" role="status" aria-live="polite"></p>
      </form>

      <section id="import-panel" class="card-form import-panel" hidden>
        <div class="import-head"><strong id="import-title">Choose sheets to track</strong><span class="count-pill" id="import-count">0 selected</span></div>
        <p class="import-note" id="import-note"></p>
        <input id="import-filter" class="import-filter" type="search" placeholder="Filter by name…" autocomplete="off">
        <div class="form-actions import-tools">
          <button class="small-btn" id="import-all" type="button">Select shown</button>
          <button class="small-btn" id="import-none" type="button">Clear</button>
        </div>
        <div id="import-list" class="import-list"></div>
        <div class="form-actions">
          <button class="btn primary" id="import-save" type="button">Save</button>
          <button class="btn" id="import-cancel" type="button">Cancel</button>
        </div>
      </section>

      <div id="group-list" class="item-list" aria-live="polite"></div>
    </section>

    <!-- STUDENTS -->
    <section id="view-students" class="view" hidden>
      <header class="view-header">
        <button class="back-button" type="button" data-nav="home" aria-label="Back">‹ Back</button>
        <h2>Students</h2><span class="count-pill" id="student-count">0 students</span>
      </header>
      <form id="student-form" class="card-form" novalidate>
        <div class="field"><label for="student-name">Student name</label><input id="student-name" type="text" maxlength="80" placeholder="e.g. Omar Gaber" autocomplete="off" required></div>
        <div class="field"><label for="student-handle">Codeforces handle</label><input id="student-handle" type="text" maxlength="25" placeholder="e.g. omar_gaber" autocomplete="off" spellcheck="false" required></div>
        <div class="field"><label>Groups <span class="hint">(a student can be in several)</span></label><div id="student-groups" class="check-list"></div></div>
        <div class="form-actions"><button class="btn primary" id="save-student" type="submit">Add student</button><button class="btn" id="cancel-edit" type="button" hidden>Cancel</button></div>
        <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      </form>
      <div id="student-list" class="item-list" aria-live="polite"></div>
    </section>

    <!-- SHEETS -->
    <section id="view-sheets" class="view" hidden>
      <header class="view-header">
        <button class="back-button" type="button" data-nav="home" aria-label="Back">‹ Back</button>
        <h2>Sheets</h2><span class="count-pill" id="sheet-count">0 sheets</span>
      </header>
      <form id="sheet-form" class="card-form" novalidate>
        <div class="field"><label for="sheet-name">Sheet name</label><input id="sheet-name" type="text" maxlength="80" placeholder="e.g. Sheet 01 — Basics" autocomplete="off" required></div>
        <div class="field"><label for="sheet-url">Codeforces contest URL</label><input id="sheet-url" type="url" inputmode="url" placeholder="https://codeforces.com/group/.../contest/..." autocomplete="off" spellcheck="false" required></div>
        <div class="field"><label for="sheet-group">Group</label><select id="sheet-group"></select></div>
        <div class="form-actions"><button class="btn primary" id="save-sheet" type="submit">Add sheet</button><button class="btn" id="use-active-sheet" type="button">Use active page</button><button class="btn" id="cancel-sheet-edit" type="button" hidden>Cancel</button></div>
        <p class="form-message" id="sheet-form-message" role="status" aria-live="polite"></p>
      </form>
      <div id="sheet-list" class="item-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="../shared/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
